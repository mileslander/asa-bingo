<!DOCTYPE html>

<html lang = "en">

<head>

    <script src = "./behavior.js" defer></script>

    <title>Bears Tennis ASA Bingo Tracker</title>

    <style>

        body {
            background-color: white;
        }

        h1 {
            text-align: center;
            padding: 10px;
            color: white;
            background-color: green;

        }

        h2 {
            text-align: center;
            padding: 10px;
            color: black;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background-color: white;
        }

        .grid-item {
            background-color: green;
            border: none;
            outline: none;
            padding: 15px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            cursor: pointer;
        }

        .checkmark {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .checkmark::after {
            content: "✓";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: #FFB81C;
            text-shadow: 0 0 4px #000;
            pointer-events: none;
        }

        </style>

    </head>

    <body>

        <h1>Bears Tennis ASA Bingo Tracker</h1>

        <h2>3 Tasks Done, 20 To Go!</h2>

        <span class = "grid-container">

            <button class = "grid-item" data-id = "pint-night">

                Attend a pint night as a team     
            
            </button>

            <button class = "grid-item" data-id = "wave-chant">

                Start the wave or a chant at a home game    

            </button>

            <button class = "grid-item" data-id = "wing-wednesday">

                Attend a wing wednesday at the pint

            </button>

            <button class= "grid-item" data-id = "back-to-back">

                Win back to back matches

            </button>

            <button class= "grid-item" data-id = "pint-karaoke">

                Do team karaoke at the pint

            </button>

            <button class= "grid-item" data-id = "team-playlist">

                Create a team playlist

            </button>

            <button class= "grid-item" data-id = "team-volunteering">

                Volunteer as a team for an event or for charity

            </button>

            <button class= "grid-item checkmark" data-id = "other-team">

                Go to another team's home game

            </button>

            <button class= "grid-item" data-id = "funny-video">

                Make a funny video for the ASA Instagram

            </button>

            <button class= "grid-item checkmark" data-id = "all-canadian">

                Have a team member make Academic All-Canadian

            </button>

            <button class= "grid-item" data-id = "welcome-scavenger">

                Have a team enter into the Welcome Week scavenger hunt

            </button>

            <button class= "grid-item" data-id = "athlete-week">

                Win Pint Whyte athlete of the week

            </button>

            <button class= "grid-item">

                <a>
                    <img src = "goldenbears.png" alt = "bear">
                </a>

            </button>

            <button class= "grid-item" data-id = "pint-duncan">

                Take a photo with Duncan at the Pint

            </button>

            <button class= "grid-item" data-id = "different-sport">

                Try a different sport as a team

            </button>

            <button class= "grid-item" data-id = "photo-shoot">

                Do a game day fit photo shoot and post it to Instagram

            </button>

            <button class= "grid-item" data-id = "all-star">

                Have a team member make an all-star list

            </button>

            <button class= "grid-item" data-id = "study-hall">

                Bring your team to study hall

            </button>

            <button class= "grid-item" data-id = "block-a">

                Have a team member earn a block A sweater

            </button>

            <button class= "grid-item" data-id = "themed-practice">

                Have a themed practice and post a photo

            </button>

            <button class= "grid-item" data-id = "guest-list">

                Make a team guest list at the Pint

            </button>

            <button class= "grid-item checkmark" data-id = "beat-dinos">

                Beat the Calgary Dinos

            </button>

            <button class= "grid-item" data-id = "pint-trivia">

                Go to a Pint trivia night

            </button>

            <button class= "grid-item" data-id = "secret-santa">

                Do a team secret santa exchange

            </button>

            <button class= "grid-item" data-id = "pint-party">

                Have a post-win after party at the pint

            </button>

        </div>

    </body>
